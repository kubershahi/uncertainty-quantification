# Dev Pod — PVC /files; NRP caps bare Pods (~16 CPU / ~32 Gi incl. shm). GPU list is Ampere/Ada-focused (edit if Pending).
# kubectl apply -f deploy/nautilus/pod-dev.yaml && kubectl wait --for=condition=Ready pod/unc-dev --timeout=20m
apiVersion: v1
kind: Pod
metadata:
  name: unc-dev
  labels:
    app: unc-dev
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-GeForce-RTX-4090
                  - NVIDIA-GeForce-RTX-4080
                  - NVIDIA-RTX-A6000
                  - NVIDIA-A40
                  - NVIDIA-L40
                  - NVIDIA-L40S
                  - NVIDIA-GeForce-RTX-3090
  containers:
    - name: main
      image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
      workingDir: /files
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 24Gi
          nvidia.com/gpu: "1"
          ephemeral-storage: 50Gi
      volumeMounts:
        - name: files
          mountPath: /files
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: files
      persistentVolumeClaim:
        claimName: unc-files
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
