# Dev Pod — PVC /files; bare-Pod CPU/RAM cap on NRP. GPU list = training-tier subset (same as deployment-heavy).
# kubectl apply -f deploy/nautilus/pod-dev.yaml
apiVersion: v1
kind: Pod
metadata:
  name: unc-dev
  labels:
    app: unc-dev
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-A10
                  - NVIDIA-A100-80GB-PCIe
                  - NVIDIA-A100-PCIE-40GB
                  - NVIDIA-A100-SXM4-80GB
                  - NVIDIA-A40
                  - NVIDIA-GeForce-RTX-3090
                  - NVIDIA-GeForce-RTX-4090
                  - NVIDIA-GH200-480GB
                  - NVIDIA-H200-NVL
                  - NVIDIA-L4
                  - NVIDIA-L40
                  - NVIDIA-L40S
                  - NVIDIA-RTX-4000-Ada-Generation
                  - NVIDIA-RTX-5000-Ada-Generation
                  - NVIDIA-RTX-A4000
                  - NVIDIA-RTX-A5000
                  - NVIDIA-RTX-A6000
                  - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                  - NVIDIA-TITAN-RTX
                  - Quadro-RTX-6000
                  - Quadro-RTX-8000
                  - Tesla-V100-SXM2-32GB
  containers:
    - name: main
      image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
      workingDir: /files
      command: ["/bin/bash", "-lc"]
      args:
        - |
          export HOME=/files/home/root
          mkdir -p "$HOME"
          export DEBIAN_FRONTEND=noninteractive
          command -v git >/dev/null && command -v ssh-keygen >/dev/null || {
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends git ca-certificates openssh-client &&
            rm -rf /var/lib/apt/lists/*;
          }
          exec sleep infinity
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 24Gi
          nvidia.com/gpu: "1"
          ephemeral-storage: 50Gi
      volumeMounts:
        - name: files
          mountPath: /files
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: files
      persistentVolumeClaim:
        claimName: unc-files
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
