# Interactive dev pod: setup venv, transfer data, smoke tests, tmux long runs.
#   kubectl apply -f deploy/nautilus/pod-dev.yaml
#   kubectl wait --for=condition=Ready pod/unc-dev --timeout=15m
#   kubectl exec -it unc-dev -- bash
#
# Apply in YOUR namespace (not committed to git):
#   kubectl config set-context --current --namespace=<your-namespace>
#
# A100/H100 often have per-namespace quota 0 on NRP; this manifest uses generic
# nvidia.com/gpu with affinity for A40 / A6000 / 3090 / V100.
apiVersion: v1
kind: Pod
metadata:
  name: unc-dev
  labels:
    app: unc-dev
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-RTX-A6000
                  - NVIDIA-A40
                  - NVIDIA-L40
                  - NVIDIA-L40S
                  - NVIDIA-GeForce-RTX-3090
                  - Tesla-V100-SXM2-32GB
                  - Tesla-V100-PCIE-32GB
  containers:
    - name: main
      image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "12"
          memory: 64Gi
          nvidia.com/gpu: "1"
          ephemeral-storage: 50Gi
      volumeMounts:
        - name: files
          mountPath: /files
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: files
      persistentVolumeClaim:
        claimName: unc-files
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
