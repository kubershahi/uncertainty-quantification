# Deployment unc-heavy — same PVC as unc-dev; higher CPU/RAM than bare Pod; Recreate strategy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unc-heavy
  labels:
    app: unc-heavy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unc-heavy
  template:
    metadata:
      labels:
        app: unc-heavy
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-4080
                      - NVIDIA-RTX-A6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-GeForce-RTX-3090
      containers:
        - name: main
          image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
          workingDir: /files
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
              ephemeral-storage: 50Gi
          volumeMounts:
            - name: files
              mountPath: /files
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: unc-files
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
