# Heavier GPU pod as a Deployment (controller-backed).
#
# NRP admission caps **bare Pods** (pod-dev.yaml) at ~16 CPU / ~32 Gi RAM.
# A Deployment-owned Pod can often request **more** (same pattern as job-unigrad-io-data.yaml).
#
#   kubectl apply -f deploy/nautilus/deployment-heavy.yaml
#   kubectl rollout status deployment/unc-heavy --timeout=20m
#   kubectl exec -it deployment/unc-heavy -- bash
#
# Uses the **same PVC** as `unc-dev` (`unc-files` → `/files`). Scale stays at 1 replica so only
# one process grabs the GPU; strategy Recreate avoids two Pods during rolls.
#
# If admission/quota rejects limits, lower cpu/memory/shm to match what worked on unc-dev,
# or run interactive sweep inside `unc-dev` with lighter checkpoints / `--mode 2d`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unc-heavy
  labels:
    app: unc-heavy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unc-heavy
  template:
    metadata:
      labels:
        app: unc-heavy
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-RTX-A6000
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-GeForce-RTX-3090
                      - Tesla-V100-SXM2-32GB
                      - Tesla-V100-PCIE-32GB
      containers:
        - name: main
          image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
          workingDir: /files
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
              ephemeral-storage: 50Gi
          volumeMounts:
            - name: files
              mountPath: /files
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: unc-files
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
