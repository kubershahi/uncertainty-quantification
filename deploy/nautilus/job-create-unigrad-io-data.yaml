# Batch job — full 3D UniGrad IO NPZ generation (resumable).
# kubectl apply -f deploy/nautilus/job-create-unigrad-io-data.yaml
# kubectl logs -f job/unc-unigrad-io-data
apiVersion: batch/v1
kind: Job
metadata:
  name: unc-unigrad-io-data
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: unc-unigrad-io-data
    spec:
      restartPolicy: OnFailure
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A40
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GH200-480GB
                      - NVIDIA-H200-NVL
                      - NVIDIA-L4
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-4000-Ada-Generation
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-RTX-A4000
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      - Quadro-RTX-8000
                      - Tesla-V100-SXM2-32GB
      containers:
        - name: main
          image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              source /files/venvs/unc/bin/activate
              cd /files/repo/uncertainty-quantification
              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              python experiments/error-map-gen/unigrad-io/create_unigrad_io_data.py --ixi-root /files/repo/uncertainty-quantification/datasets/IXI --atlas-pkl /files/repo/uncertainty-quantification/datasets/IXI/atlas.pkl --output-path /files/repo/uncertainty-quantification/datasets/error-map/unigrad-io/ixi --io-iterations 50
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 64Gi
              nvidia.com/gpu: "1"
              ephemeral-storage: 50Gi
          volumeMounts:
            - name: files
              mountPath: /files
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: unc-files
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
