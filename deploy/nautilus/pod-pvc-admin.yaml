# Lightweight admin pod — PVC /files, git, SSH, kubectl cp. Same image as unc-heavy / unc-jupyter (no GPU).
# NRP bare-Pod cap ~16 CPU / ~32 Gi (incl. shm); this manifest stays well under that.
# kubectl delete pod unc-dev --ignore-not-found
# kubectl apply -f deploy/nautilus/pod-pvc-admin.yaml
# kubectl wait --for=condition=Ready pod/unc-dev --timeout=20m
# kubectl exec -it unc-dev -- bash
apiVersion: v1
kind: Pod
metadata:
  name: unc-dev
  labels:
    app: unc-dev
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-devel
      workingDir: /files
      env:
        - name: HOME
          value: /files/home/root
      command: ["/bin/bash", "-lc"]
      args:
        - |
          export HOME=/files/home/root
          mkdir -p "$HOME"
          export DEBIAN_FRONTEND=noninteractive
          command -v git >/dev/null && command -v ssh-keygen >/dev/null || {
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends git ca-certificates openssh-client &&
            rm -rf /var/lib/apt/lists/*;
          }
          ENV_SH=/files/repo/uncertainty-quantification/deploy/nautilus/scripts/env.sh
          if [[ -f "${ENV_SH}" ]]; then
            MARK="# unc-nautilus-env"
            if ! grep -qF "${MARK}" "${HOME}/.bashrc" 2>/dev/null; then
              { echo "${MARK}"; echo "source \"${ENV_SH}\""; } >> "${HOME}/.bashrc"
            fi
            # shellcheck source=/dev/null
            source "${ENV_SH}"
          fi
          exec sleep infinity
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: files
          mountPath: /files
  volumes:
    - name: files
      persistentVolumeClaim:
        claimName: unc-files
